<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login  Gucode</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container"> 
        <div class="imagem-login-background"></div>
        <div class="container-login">
            <form class="formulario-login">
            <h1 id = entrar>Entrar</h1>
            <p>Entre com sua Conta</p>
                <label for="email"></label>
                <input type="email" id="email-login" placeholder="Email" required>

                <label for="senha"></label>
                <input type="password" id="password-form" placeholder="Senha" required>
                <a id="esqueci-senha" href="#">Esqueci a Senha</a>
                <button type="submit">Entrar</button>
            </form>

            <p>Não Tenho um conta. <a href="#">Criar conta</a></p>

        </div>
    </div>
    
</body>
</html>
