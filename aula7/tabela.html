<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Compra</title>
    <style>
        body{
            text-align: center;
        }
        h1{
            text-align: center;
        }
        table{
            border-collapse: collapse;
            margin: auto;
        }
        thead{
            background-color: rgb(132, 193, 243);
            color: black;
        }
        tr{
            border: 1px solid black;
        }
        td{
            border: 1px solid black;
        }
    </style>
</head>
<body style="font-family: Montserrat;">
    <h1>Lista de Compras</h1>
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Computador</td>
                <td style="text-align: center;">1</td>
                <td style="text-align: right;">R$ 5980,00</td>
                <td style="text-align: right;">R$ 5980,00</td>
            </tr>
            <tr>
                <td>Mouse sem fio</td>
                <td style="text-align: center;">2</td>
                <td style="text-align: right;">R$ 150,00</td>
                <td style="text-align: right;">R$ 300,00</td>
            </tr>
            <tr>
                <td>Monitor</td>
                <td style="text-align: center;">1</td>
                <td style="text-align: right;">R$ 1800,00</td>
                <td style="text-align: right;">R$ 1800,00</td>
            </tr>
            <tr>
                <td>Suporte Monitor</td>
                <td style="text-align: center;">1</td>
                <td style="text-align: right;">R$ 480,00</td>
                <td style="text-align: right;">R$ 480,00</td>
            </tr>
        </tbody>
        <tfoot style="border-top: 2px solid rgb(0, 2, 122); background-color: azure;">
            <tr>
                <td colspan="3" style="text-align: right;">Total</td>
                <td>R$ 8560,00</td>
            </tr>
        </tfoot>
    </table>
    <br><br>
    <a href="../index.html"><button style="background-color:aliceblue; border: 1px solid #045e82; border-radius: 20px;">Voltar</button></a>
</body>
</html>
