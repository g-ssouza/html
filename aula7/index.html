<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table{
            border-collapse: collapse;
            border: 1px solid black;
        }
        tr{
            border-collapse: collapse;
            border: 1px solid black;
        }
        th{
            border-collapse: collapse;
            border: 1px solid black;
        }
        td{
            border-collapse: collapse;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <tr>
                <td colspan="3" style="background-color: rgb(111, 132, 247);">Informações</td>
            </tr>
            <th>Nome</th>
            <th>idade</th>
            <th>Profissão</th>
        </tr>
        <tr>
            <td>Gustavo</td>
            <td>16</td>
            <td>Engenheiro</td>
        </tr>
    </table>

</body>
</html>
